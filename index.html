<style>
/* CalledB — app layer. Tokens and components come from edb-brand.css. */
html,body{height:100%}
body{overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{height:100vh;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.cap{font-size:11px;line-height:1.3;color:var(--muted-text);letter-spacing:.02em}
.plain{background:none;border:0;padding:0;margin:0;color:inherit;font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.plain:focus-visible{outline:none;box-shadow:var(--focus-ring)}

/* title bar and tabs */
.top{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:calc(10px + var(--safe-top)) max(12px,var(--safe-right)) 8px max(16px,var(--safe-left))}
.top-l{display:flex;flex-direction:column;gap:5px;min-width:0}
.dept{display:inline-flex;align-items:center;gap:4px;align-self:flex-start;min-height:24px;color:var(--muted-text)}
.top h1{font-size:23px;font-weight:600;letter-spacing:-.01em;line-height:1.1;white-space:nowrap}
.top-r{display:flex;align-items:center;gap:4px;margin-bottom:-4px}
.nb{width:36px;height:44px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted-text)}
.nb:disabled{opacity:.35;cursor:default}
.tabs{flex:none;padding:0 12px}
.tabs .tab{padding:10px 12px;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.pane{flex:1;min-height:0}
.foot-cap{position:fixed;right:max(16px,var(--safe-right));bottom:calc(12px + var(--safe-bottom));height:18px;line-height:18px;max-width:calc(100% - 96px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;pointer-events:none;z-index:var(--z-sig)}

/* month: the whole month and the card on one screen */
.month{display:flex;flex-direction:column;gap:8px;overflow:hidden;padding:10px max(6px,var(--safe-right)) calc(38px + var(--safe-bottom)) max(6px,var(--safe-left))}
.month .cal{flex:1;min-height:0;grid-template-rows:auto repeat(var(--rows,5),minmax(0,1fr))}
.month.roomy{overflow:auto}
.month.roomy .cal{flex:none;grid-template-rows:auto repeat(var(--rows,5),64px)}
.cal .wd{padding:0 0 4px;line-height:14px}
.cal .d{min-height:0;justify-content:flex-start;gap:0;padding:3px 1px;overflow:hidden;width:100%;font:inherit;color:inherit;text-align:left;cursor:pointer;appearance:none;-webkit-appearance:none;-webkit-tap-highlight-color:transparent}
.cal .d.off{cursor:default}
/* weekends: one band behind each weekend column, from the S at the top to the last row; weekdays sit flat on the page */
:root{--wk:var(--surface-high)}
[data-theme="light"]{--wk:var(--surface)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]):not([data-theme="light"]){--wk:var(--surface)}}
.cal{position:relative}
.cal::before,.cal::after{content:'';position:absolute;z-index:0;top:0;bottom:0;width:calc((100% - 12px) / 7);background:var(--wk);border:1px solid var(--border);border-radius:var(--radius-lg);box-sizing:border-box;pointer-events:none}
.cal::before{left:0}
.cal::after{right:0}
.cal>*{position:relative;z-index:1}
.cal .d{background:transparent}
.cal .d.we{border-color:transparent}
.cal .wd:nth-child(1),.cal .wd:nth-child(7){color:var(--text);font-weight:600}
.cal .d.sel{border-color:var(--success-text);box-shadow:inset 0 0 0 1px var(--success-text)}
.cal .d:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.d .dtop{flex:none;display:flex;align-items:center;gap:2px;height:14px;padding:0 3px;overflow:hidden;white-space:nowrap}
.d.today .dtop{padding:0 2px}
.d .dtop .dn{margin-right:auto}
.cal .dn{color:var(--muted-text);line-height:14px}
.d .phm{font-size:11px;font-weight:600;line-height:14px}
/* today is the word Today in bold where the date would be; a holiday keeps its red */
.cal .d.today{border-color:var(--border)}
.cal .d.we.today{border-color:transparent}
.cal .d.today.sel{border-color:var(--success-text)}
.cal .d.today .dn{font-family:var(--font-ui);font-weight:700;letter-spacing:0;color:var(--text)}
.cal .d.ph .dn,.d .phm{color:var(--cat-text)}
.d .mk{flex:none;padding:0 4px;border:0;font-size:11px;font-weight:600;line-height:14px;letter-spacing:0}
.d .mk.bare{padding:0;background:none;color:var(--cat-text)}
.box{flex:1;min-height:0;min-width:0;width:100%;display:flex;flex-direction:column;justify-content:space-evenly}
.nm{display:block;min-height:0;height:15px;line-height:15px;padding:0 2px;overflow:hidden;white-space:nowrap;font-size:11px;letter-spacing:-.1px;color:var(--text)}
.nm .in,.tn .in{display:inline-block;transform-origin:0 50%;white-space:nowrap}
.nm i{font-style:normal;color:var(--muted-text)}
.nm u{text-decoration:none;color:var(--muted-text);margin-left:1px}
.nm.cut .in,.tn.cut .in{display:block;overflow:hidden;text-overflow:ellipsis}
.nm.mine{padding:0}
.nm .in.cat{padding:0 4px;border:0;font-size:11px;font-weight:600;line-height:15px;letter-spacing:0}
.nm .in.cat i{color:inherit}
.month-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;color:var(--muted-text);padding:24px}
.month-empty p{margin:0;max-width:34ch}

/* the card under the month */
.tc{flex:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:10px 12px}
.th{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.th .cap{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th .hol{color:var(--cat-text)}
.tg{display:grid;gap:6px;min-height:55px}
.tg>div{display:flex;flex-direction:column;gap:3px;min-width:0}
.tn{display:block;height:17px;line-height:17px;overflow:hidden;white-space:nowrap;font-size:14px;font-weight:600}
.tn .in.cat{padding:0 7px;border:0;font-size:13px;line-height:17px}
.month.tight .tc{padding:6px 10px}
.month.tight .th{margin-bottom:4px}
.month.tight .tg{min-height:0}
.tc .tx{display:block;margin-top:6px}
.month.tight .tc .tx{margin-top:3px}

/* list */
.list{overflow:auto;-webkit-overflow-scrolling:touch;padding:0 max(12px,var(--safe-right)) calc(44px + var(--safe-bottom)) max(12px,var(--safe-left))}
.tb{margin-top:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg)}
.r{display:grid;grid-template-columns:50px repeat(var(--cols,3),minmax(0,1fr));align-items:center;min-height:44px;padding:6px 10px;border-top:1px solid var(--border)}
.r.h{position:sticky;top:0;z-index:1;min-height:28px;padding-top:0;padding-bottom:0;border-top:0;border-bottom:1px solid var(--border);margin-bottom:-1px;background:var(--surface);color:var(--muted-text);border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.r.x{grid-template-rows:auto auto;row-gap:5px;align-content:center;min-height:62px}
.r.x .dc{grid-row:1 / span 2}
.r.we{background:var(--surface-high)}
.r.td{box-shadow:inset 0 0 0 1px var(--accent-text)}
.r:last-child{border-radius:0 0 var(--radius-lg) var(--radius-lg)}
.dc{display:flex;flex-direction:column;gap:3px}
.dc .num{font-size:15px;line-height:1}
.r.ph .dc .cap,.r.ph .dc .num{color:var(--cat-text)}
.n{display:flex;flex-direction:column;align-items:flex-start;min-width:0;font-size:14px;line-height:1.2}
.n.lead{font-weight:600}
.n.two{font-size:13px;line-height:1.25}
.n>span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n .cat{padding:3px 9px;border:0;font-size:13px}
.sub{grid-column:2 / -1;font-size:11px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub em{font-style:normal;color:var(--muted-text);margin-right:3px}
.sub s{text-decoration:none;color:var(--muted-text);margin:0 5px}

/* updates */
.ups{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.up{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px}
.up-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.up h3{font-family:var(--font-ui);font-size:16px;font-weight:600;letter-spacing:0;line-height:1.3}
.up ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--border)}
.up li{display:grid;grid-template-columns:74px minmax(0,1fr);gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;line-height:1.35}
.up li:last-child{border-bottom:0;padding-bottom:0}
.up li .was{color:var(--muted-text);text-decoration:line-through}
.up .you{margin-left:6px;padding:1px 7px;border:0;font-size:11px}
.ups .none{color:var(--muted-text);text-align:center;padding:32px 16px}

/* department */
#v-dept{padding-top:var(--safe-top)}
.dp-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px max(16px,var(--safe-right)) 12px max(16px,var(--safe-left))}
.dp-head h1{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.dp-acts{display:flex;gap:8px}
.dp-head .icon-btn{width:44px;height:44px}
.dp-search{flex:none;padding:0 16px 12px}
/* hospitals down a rail, the chosen hospital's departments beside it */
.dp-split{flex:1;min-height:0;display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;padding:0 max(16px,var(--safe-right)) calc(42px + var(--safe-bottom)) 0}
.dp-rail{min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;display:flex;flex-direction:column;border-right:1px solid var(--border);padding-left:var(--safe-left)}
.dp-rail::-webkit-scrollbar{display:none}
.dp-rail button{flex:none;min-height:44px;display:flex;align-items:center;padding:0 6px 0 16px;background:none;border:0;border-radius:0;font:600 13px/1 var(--font-ui);letter-spacing:.04em;color:var(--muted-text);text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dp-rail button[data-h="*"]{letter-spacing:0}
.dp-rail button[aria-selected="true"]{background:var(--surface-high);color:var(--text)}
.dp-rail button:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
.dp-pane{min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px}
.dp-pane>.btn{flex:none;width:100%;justify-content:center;min-height:48px;font-size:16px}
.dp-list{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:6px;padding:4px 0 0}
.dp-list .tag{margin:0}
.dp-hn{margin:2px 0 6px;font-size:20px;font-weight:600;line-height:1.2;color:var(--text)}
.dp-list [role="radiogroup"]{display:flex;flex-direction:column;gap:6px}
.dr{display:flex;align-items:center;gap:2px}
.dr .opt{flex:1;min-width:0}
/* name and list status share a line when there is room; on a narrow phone the status drops under the name */
.dr .opt .lt{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;column-gap:10px}
.dr .opt .on{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr .opt .cap{flex:none}
.dr .pin{flex:none;width:44px;height:44px;border-color:transparent;color:var(--muted-text)}
.dr .pin[aria-pressed="true"]{color:var(--accent-text)}
.dp-none{margin:0;color:var(--muted-text);padding:24px 0}

/* welcome: seen once per phone, until a department is chosen */
#v-hello{padding:var(--safe-top) max(16px,var(--safe-right)) calc(42px + var(--safe-bottom)) max(16px,var(--safe-left))}
.hl-mid{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-bottom:22%;text-align:center}
.hl-mid h1{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.hl-mid p{margin:0;font-size:16px;color:var(--muted-text)}
.hl-foot{flex:none}
.hl-foot .btn{width:100%;justify-content:center;min-height:48px;font-size:16px}

/* sheets: --kb lifts a sheet above the on-screen keyboard */
.sheet{display:flex;flex-direction:column;gap:16px;bottom:var(--kb,0px)}
.sheet .grab{flex:none;margin-bottom:-4px}
.sheet-h{margin-bottom:0}
.sheet p{margin:0;color:var(--muted-text)}
.sheet form{display:flex;flex-direction:column;gap:16px}
.sheet .btn-primary{justify-content:center;min-height:44px}
.field .lab{font-size:12px;color:var(--muted-text)}
.hint{display:flex;align-items:center;gap:6px;min-height:18px;font-size:12px;color:var(--muted-text)}
.hint.ok{color:var(--success-text)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--border);padding-top:12px}
.set-row>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.set-row .btn{flex:none;min-height:44px}
.about{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted-text)}
.about .mark{display:inline-flex;height:14px;color:var(--text);opacity:.72}
.about .mark svg{height:14px;width:auto}
.sheet .alert{flex-wrap:wrap;justify-content:flex-end}
.sheet .alert .btn{min-height:44px}
#dev-body{display:flex;flex-direction:column;gap:12px}
#dev-body h3{font-family:var(--font-ui);font-size:12px;font-weight:600;letter-spacing:0;color:var(--muted-text)}
#dev-body .kv>div{font-size:13px;padding:6px 0}
#dev-body .kv dd{min-width:0;overflow-wrap:anywhere}
.dev-acts{display:flex;flex-wrap:wrap;gap:8px}
.dev-acts .btn{min-height:44px}
.page-state{flex:1;min-height:0}
@media (prefers-reduced-motion: reduce){details.hs summary .icon{transition:none}}
</style>
<script>
/* Theme before first paint. try/catch: storage can be unavailable. */
(function(){try{var t=localStorage.getItem('eds-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);else if(t==='system')document.documentElement.removeAttribute('data-theme')}catch(e){}})();
</script>
</head>
<body>

<script>
(function(){
'use strict';
var VERSION='0.3.0',BUILT='27/11/2026';
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var WD3=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], WD1=['S','M','T','W','T','F','S'];
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function iso(y,m,d){return y+'-'+pad(m)+'-'+pad(d)}
function icon(n,c){return '<svg class="icon'+(c?' '+c:'')+'" aria-hidden="true"><use href="#ph-'+n+'"/></svg>'}
var store={
  get:function(k,d){try{var v=localStorage.getItem('calledb:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem('calledb:'+k,JSON.stringify(v))}catch(e){}}
};

var S={index:null,dept:store.get('dept',null),pins:store.get('pins',[]),tab:'month',ym:null,sel:null,months:{},ups:null,key:null,pick:null,q:'',wasMain:false};

/* ── dates ── */
function ymOf(d){return d.slice(0,7)}
function dmy(d){return d.slice(8)+'/'+d.slice(5,7)+'/'+d.slice(0,4)}
function dowOf(d){return new Date(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8)).getDay()}
function monthName(ym){return MONTHS[+ym.slice(5)-1]+' '+ym.slice(0,4)}
function dateISO(dt){return iso(dt.getFullYear(),dt.getMonth()+1,dt.getDate())}
function todayISO(){return dateISO(new Date())}
function changeover(){var l=listInfo(S.dept),c=(l&&l.changeover)||'00:00';return +c.slice(0,2)*60+(+c.slice(3))}
/* A call day starts at the department's changeover (08:00 at YCH), so 02:00 still belongs to yesterday's list. */
function callDayISO(){return dateISO(new Date(Date.now()-changeover()*60000))}

/* ── index ── */
function listInfo(id){return S.index&&S.index.lists?S.index.lists[id]:null}
function hosp(id){var h=id.split('/')[0];return S.index.hospitals.filter(function(x){return x.id===h})[0]}
function depn(id){var d=id.split('/')[1];return S.index.departments.filter(function(x){return x.id===d})[0]}
function known(id){return !!(id&&hosp(id)&&depn(id))}
function shortLabel(id){return hosp(id).abbr+' · '+depn(id).name}
function fullLabel(id){return hosp(id).name+' · '+depn(id).name}
function latestMonth(id){var l=listInfo(id),k=l?Object.keys(l.months).sort():[];return k.length?k[k.length-1]:null}
function reach(){var l=listInfo(S.dept),a=l?Object.keys(l.months):[],t=ymOf(todayISO());if(a.indexOf(t)<0)a.push(t);return a.sort()}
function getJSON(u){return fetch(u,{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})}

/* ── lock ── */
var te=new TextEncoder(),td=new TextDecoder();
function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function b64e(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function normPass(p){return p.trim().toLowerCase().replace(/\s+/g,' ')}
function deriveRaw(pass,lock){
  return crypto.subtle.importKey('raw',te.encode(normPass(pass)),'PBKDF2',false,['deriveBits']).then(function(km){
    return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64d(lock.salt),iterations:lock.iter},km,256)}).then(function(b){return new Uint8Array(b)})}
function importKey(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt'])}
function unseal(key,box,aad){
  return crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(box.iv),additionalData:te.encode(aad)},key,b64d(box.ct)).then(function(pt){return td.decode(pt)})}
function checkKey(tag,lock,key){return unseal(key,lock.check,'calledb|'+tag+'|check').then(function(t){return t==='calledb'},function(){return false})}
/* Each department has its own salt, so its own key: opening one never opens another, even with the same words. */
function storedKey(id){
  var l=listInfo(id),k=store.get('key:'+id,null);
  if(!l||!l.lock||!k||k.kid!==l.lock.kid)return Promise.resolve(null);
  return importKey(b64d(k.k)).then(function(key){return checkKey(id,l.lock,key).then(function(ok){return ok?key:null})},function(){return null})}

/* ── sheets ── */
var openSheet=null,lastFocus=null,passDone=null;
function showSheet(el,focusEl){
  lastFocus=document.activeElement;openSheet=el;$('scrim').hidden=false;el.hidden=false;
  requestAnimationFrame(function(){el.classList.add('open');if(focusEl)focusEl.focus()})}
function hideSheet(){
  var el=openSheet;if(!el)return;openSheet=null;el.classList.remove('open');$('scrim').hidden=true;
  setTimeout(function(){if(openSheet!==el)el.hidden=true},360);
  if(lastFocus&&lastFocus.focus)lastFocus.focus();
  if(el.id==='sheet-pass'&&passDone){var f=passDone;passDone=null;f(null)}}
var passFor=null;
function askSecret(o){
  return new Promise(function(res){
    passDone=res;passFor=o;$('pass-h').textContent=o.title;$('pass-p').textContent=o.text;$('pc-lab').textContent=o.label;
    $('pc').type=o.hidden?'password':'text';$('pc').placeholder=o.hint;

  var l=listInfo(S.dept)||{months:{}},m=S.months[S.ym],cal=$('cal'),cell=cal.querySelector('.d[data-d]'),out=[];
  var uniq=function(sel,f){var o={};cal.querySelectorAll(sel).forEach(function(e){if(!f||f(e))o[e.textContent]=1});return Object.keys(o).join(', ')||'none'};
  var unlocked=[],i,k;try{for(i=0;i<localStorage.length;i++){k=localStorage.key(i);if(k.indexOf('calledb:key:')===0)unlocked.push(k.slice(12))}}catch(e){}
  var pr=document.createElement('div');pr.style.cssText='position:fixed;visibility:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)';document.body.appendChild(pr);
  var cs=getComputedStyle(pr),safe=parseInt(cs.paddingTop)+' / '+parseInt(cs.paddingBottom);pr.remove();
  var home=!!(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  out.push(['App',[['Version','v'+VERSION],['Built',BUILT],['Opened as',home?'Home Screen app':'Browser tab'],['Signal',navigator.onLine?'Online':'Offline'],
    ['Offline copy',('serviceWorker' in navigator&&navigator.serviceWorker.controller)?'Ready':'Not yet'],['Screen',innerWidth+' × '+innerHeight+' px, safe areas '+safe]]]);
  out.push(['Lists',[['Index updated',dmy(S.index.updated)],['Hospitals',S.index.hospitals.length],['Departments',S.index.departments.length],
    ['With a list',Object.keys(S.index.lists).filter(function(d){return Object.keys(S.index.lists[d].months).length}).join(', ')||'none']]]);
  out.push(['This department',[['Id',S.dept],['Lock',l.lock?l.lock.kid:'none'],['Call day starts',l.changeover||'not set'],
    ['Months',Object.keys(l.months).map(function(ym){var x=l.months[ym];return ym+(x.rev?' rev '+x.rev:'')+', added '+dmy(x.added)}).join('; ')||'none'],['Updates',l.updates?l.updates.n:0]]]);
  if(m)out.push([monthName(S.ym),[['Read from',m.source.file],['Sheet title',m.source.title],['Read on',dmy(m.source.read)],
    ['Tiers',m.tiers.map(function(t){return t.short+' ('+t.role+')'}).join(', ')],['People',m.people.length],
    ['Month row',cell&&cell.offsetHeight?cell.offsetHeight+' px'+($('p-month').classList.contains('tight')?', tight':'')+($('p-month').classList.contains('roomy')?', scrolling':''):'open the Month tab to measure'],
    ['Names tightened',uniq('.nm',function(e){return e.firstElementChild&&e.firstElementChild.style.transform})],
    ['Surname only',uniq('.nm[data-shortened]')],['Names cut',uniq('.nm.cut')],
    ['Reader notes',(m.notes&&m.notes.length)?m.notes.join('; '):'none']]]);
  out.push(['This phone',[['Unlocked',unlocked.join(', ')||'none'],['Pinned',S.pins.join(', ')||'none'],['Your name',store.get('me:'+S.dept,'')||'not set']]]);
  return out}
function openDev(){
  $('dev-body').innerHTML=devInfo().map(function(sec){return '<section><h3>'+esc(sec[0])+'</h3><dl class="kv">'+sec[1].map(function(r){
    return '<div><dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd></div>'}).join('')+'</dl></section>'}).join('');
  $('dev-copy').textContent='Copy diagnostics';showSheet($('sheet-dev'),null)}
function resetAll(){
  try{var ks=[],i,k;for(i=0;i<localStorage.length;i++){k=localStorage.key(i);if(k.indexOf('calledb:')===0||k==='eds-theme')ks.push(k)}
    ks.forEach(function(x){localStorage.removeItem(x)})}catch(e){}
  location.reload()}
function meMsg(){
  var m=S.months[S.ym],el=$('me-msg'),v=me();el.className='hint';
  if(!v||!m){el.textContent=v?'':'Your call days are marked once your name matches the list.';return}
  var n=myDays(m).length;
  if(n){el.className='hint ok';el.innerHTML=icon('check-circle','sm')+'<span>On the list: <span class="num">'+n+'</span> call'+(n===1?'':'s')+' in '+esc(MONTHS[+S.ym.slice(5)-1])+'. Your days are marked.</span>'}
  else el.textContent='Not on the '+MONTHS[+S.ym.slice(5)-1]+' list under that name. Type it exactly as the list prints it.'}
function setTheme(mode){
  var r=document.documentElement;if(mode==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',mode);
  try{localStorage.setItem('eds-theme',mode)}catch(e){}
  document.querySelectorAll('.segmented [data-mode]').forEach(function(b){b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',b.dataset.mode===mode)})}

/* ── wiring ── */
function go(ym){S.ym=ym;S.sel=null;loadShow()}
function wire(){
  $('dp-list').addEventListener('click',onDeptClick);$('dp-rail').addEventListener('click',onDeptClick);
  $('hl-go').addEventListener('click',showDept);
  $('dp-find').addEventListener('click',function(){var on=$('dp-search').hidden;if(!on&&S.q){S.q='';$('dp-q').value='';renderDept()}findBar(on)});
  $('dp-q').addEventListener('input',function(){S.q=this.value;S.seek=true;renderDept()});
  $('dp-open').addEventListener('click',function(){if(S.pick)enter(S.pick)});
  $('dp-close').addEventListener('click',function(){show('main')});
  $('dept-btn').addEventListener('click',showDept);
  $('prev').addEventListener('click',function(){var r=reach(),i=r.indexOf(S.ym);if(i>0)go(r[i-1])});
  $('next').addEventListener('click',function(){var r=reach(),i=r.indexOf(S.ym);if(i>=0&&i<r.length-1)go(r[i+1])});
  $('tab-month').addEventListener('click',function(){S.tab='month';renderChrome();renderBody(S.months[S.ym])});
  $('tab-list').addEventListener('click',function(){S.tab='list';renderChrome();renderBody(S.months[S.ym])});
  $('tab-updates').addEventListener('click',function(){S.tab='updates';renderChrome();renderBody(S.months[S.ym])});
  $('dev-btn').addEventListener('click',function(){
    hideSheet();if(devOn())openDev();else askDev().then(function(key){if(key)openDev()})});
  $('dev-off').addEventListener('click',function(){try{localStorage.removeItem('calledb:dev')}catch(e){}hideSheet()});
  $('dev-copy').addEventListener('click',function(){
    var t=devInfo().map(function(sec){return sec[0]+'\n'+sec[1].map(function(r){return '  '+r[0]+': '+r[1]}).join('\n')}).join('\n'),b=this;
    var ok=function(){b.textContent='Copied'},no=function(){b.textContent='Copy failed'};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,no);else no()});
  $('dev-cache').addEventListener('click',function(){
    var b=this;b.disabled=true;b.textContent='Clearing';
    var c=window.caches?caches.keys().then(function(ks){return Promise.all(ks.filter(function(k){return k.indexOf('calledb-')===0}).map(function(k){return caches.delete(k)}))}):Promise.resolve();
    var w=('serviceWorker' in navigator)?navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}):Promise.resolve();
    Promise.all([c,w]).then(function(){location.reload()},function(){location.reload()})});
  $('reset-btn').addEventListener('click',function(){$('reset-row').hidden=true;$('reset-ask').hidden=false;$('reset-no').focus()});
  $('reset-no').addEventListener('click',function(){$('reset-ask').hidden=true;$('reset-row').hidden=false});
  $('reset-yes').addEventListener('click',resetAll);
  $('cal').addEventListener('click',function(ev){
    var c=ev.target.closest('.d[data-d]');if(!c)return;S.sel=c.dataset.d;
    $('cal').querySelectorAll('.d[data-d]').forEach(function(x){var on=x===c;x.classList.toggle('sel',on);x.setAttribute('aria-pressed',on)});
    renderCard(S.months[S.ym]);layout()});
  $('v-main').addEventListener('click',function(ev){
    var t=ev.target;if(t.id==='st-retry')loadShow();else if(t.id==='st-change')showDept();else if(t.id==='st-reload')location.reload();else if(t.id==='go-latest')go(t.dataset.ym)});
  $('gear').addEventListener('click',openSettings);
  $('set-change').addEventListener('click',function(){hideSheet();showDept()});
  $('me').addEventListener('input',function(){store.set('me:'+S.dept,this.value);meMsg();renderBody(S.months[S.ym])});
  $('pass-form').addEventListener('submit',submitPass);
  $('scrim').addEventListener('click',hideSheet);
  document.querySelectorAll('[data-close]').forEach(function(b){b.addEventListener('click',hideSheet)});
  document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&openSheet)hideSheet()});
  document.querySelectorAll('.segmented [data-mode]').forEach(function(b){b.addEventListener('click',function(){setTheme(b.dataset.mode)})});
  var saved='dark';try{saved=localStorage.getItem('eds-theme')||'dark'}catch(e){}
  document.querySelectorAll('.segmented [data-mode]').forEach(function(b){b.classList.toggle('active',b.dataset.mode===saved);b.setAttribute('aria-pressed',b.dataset.mode===saved)});
  var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(layout,80)});
  if(window.visualViewport){var vv=window.visualViewport,kb=function(){
    document.documentElement.style.setProperty('--kb',Math.max(0,Math.round(window.innerHeight-vv.height-vv.offsetTop))+'px')};
    vv.addEventListener('resize',kb);vv.addEventListener('scroll',kb)}
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(layout);
  /* the call day rolls over while the app is open: redraw when it comes back to the front */
  document.addEventListener('visibilitychange',function(){
    if(document.hidden||$('v-main').hidden||!S.months[S.ym])return;
    var cd=callDayISO();if(S.lastCD&&S.lastCD!==cd&&ymOf(cd)===S.ym)S.sel=cd;S.lastCD=cd;renderBody(S.months[S.ym])});
}
function boot(){
  wire();S.lastCD=null;
  getJSON('./data/index.json').then(function(ix){
    S.index=ix;S.pins=S.pins.filter(known);
    if(known(S.dept))return enter(S.dept).then(function(){S.lastCD=callDayISO();if($('v-main').hidden)showDept()});
    S.dept=null;show('hello')
  }).catch(function(){
    $('v-main').hidden=false;$('dept-tag').textContent='CalledB';$('month-title').textContent='';$('prev').disabled=$('next').disabled=true;
    $('p-month').hidden=true;$('p-list').hidden=true;$('p-state').hidden=false;
    $('p-state').innerHTML='<h2>CalledB did not load</h2><p>You may be offline. Open it once with signal and it is kept on this phone.</p><button class="btn btn-primary" id="st-reload">Try again</button>'});
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
    navigator.serviceWorker.register('./sw.js').catch(function(){})}
}
window.CalledB={version:VERSION,state:S};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
